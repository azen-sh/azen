services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: azen-api:local-test
    restart: always
    env_file: 
      - apps/api/.env
    ports:
      - "8080:8080"
    depends_on: 
      - redis  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker: 
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: azen-api:local-test
    restart: always
    env_file:
      - apps/api/.env
    depends_on:
      - redis
    command: ["bun", "run", "start:worker"]

  redis:
    container_name: redis-local
    image: redis:7
    restart: always
    ports: 
      - "6379:6379"
    volumes:
      - redis-data:/data  

volumes:
  redis-data:
